<div class="banner">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="banner-content">
                    <h2>Contáctanos</h2>
                    <div class="breadcrumbs-page">
                        <nav class="nav-breadcrumb">
                            <a href="/">Inicio</a>
                            <span class="breadcrumb-separator"> / </span>Contáctanos
                        </nav>

                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
<section class="section-content section-contacto">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="encuentranos-wrapper">
                    <div class="encuentranos-items encuentranos-contactos">

                        <div class="encuentranos-contactos-items">
                            <div class="encuentranos-contactos-text">
                                <i class="bi bi-clock-fill"></i>
                                <span>Horario:</span>
                                <span>Lunes a sábados: 8am a 5pm</span>
                                <span>Domingos: No hay atención</span>
                            </div>
                            <div class="encuentranos-contactos-text">
                                <i class="bi bi-telephone-fill"></i>
                                <span>Telefono:</span>
                                <span>999888777</span>
                                <span>555444333</span>
                            </div>

                            <div class="encuentranos-contactos-text">
                                <i class="bi bi-envelope-fill"></i>
                                <span>Correo:</span>
                                <span>emial@gmail.com</span>
                            </div>



                        </div>

                        <div class="encuentranos-contactos-items libro-reclamaciones">
                            <h2>Envíanos un mensaje</h2>
                            <form id="frm-pasteleria">
                                <div class="contenedor-form">
                                    <label for="">Nombres y apellidos <strong>*</strong></label>
                                    <input type="text" name="nombre" id="nombre" class="inputs" required>
                                </div>

                                <div class="contenedor-form">
                                    <label for="">Celular <strong>*</strong></label>
                                    <input type="text" name="celular" id="celular" class="inputs" const packageName = require('packageName');>
                                </div>

                                <div class="contenedor-form">
                                    <label for="">Correo electrónico <strong>*</strong></label>
                                    <input type="email" name="correo" id="correo" class="inputs" required>
                                </div>

                                <div class="contenedor-form">
                                    <label for="">Mensaje <strong>*</strong></label>
                                    <textarea  name="mensaje" class="inputs" id="mensaje" style="padding: 15px 9px;">

                                    </textarea>
                                </div>

                                <div id="contenedor-resultado" class="col-md-12">
                                    <span id="resultado"></span>

                                </div>
                                <br>

                                <div class="contenedor-form">
                                    <button id="btn-enviar" type="submit">Enviar</button>
                                </div>

                            </form>

                        </div>
                    </div>

                </div>


            </div>
        </div>
    </div>

</section>
